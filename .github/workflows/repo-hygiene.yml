name: Repo Hygiene

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-path-hygiene:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aeonite-cts

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: aeonite-cts

      - name: Checkout semantic specification dependency
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: aeonite-org/aeonite-specs
          ref: d4801c7e4814af1ef6e51951c0af3f3d429f04fb
          path: aeonite-specs

      - name: Set up semantic runner Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Install semantic runner dependencies
        run: python3 -m pip install -r runners/requirements-aeonic-operations.txt

      - name: Check for local filesystem paths
        run: bash ./scripts/pre-commit-check.sh

      - name: Validate CTS manifests and immutable suite hashes
        run: python3 runners/validate_cts_repo.py

      - name: Verify snapshot integrity and development fixtures
        run: python3 -m unittest discover -s runners -p 'test_*.py'

  rational-runner-python39:
    # Keep the minimum-runtime job on an image with Python 3.9 distributions.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: aeonite-cts
    steps:
      - name: Checkout CTS
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: aeonite-cts
      - name: Checkout rational specification dependency
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: aeonite-org/aeonite-specs
          ref: d4801c7e4814af1ef6e51951c0af3f3d429f04fb
          path: aeonite-specs
      - name: Set up Python 3.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"
      - name: Install isolated job dependencies
        run: python3 -m pip install -r runners/requirements-aeonic-operations.txt
      - name: Verify rational runner behavior
        run: python3 -m unittest discover -s runners -p test_aeonic_rational_arithmetic_runner.py
      - name: Validate frozen artifacts without claiming conformance
        run: python3 runners/run_aeonic_rational_arithmetic.py --specs-root ../aeonite-specs --check
      - name: Validate mutable artifacts without claiming conformance
        run: python3 runners/run_aeonic_rational_arithmetic.py --specs-root ../aeonite-specs --manifest cts/aeonic-rational-arithmetic/v1/aeonic-rational-arithmetic-cts.v1.next.json --check
