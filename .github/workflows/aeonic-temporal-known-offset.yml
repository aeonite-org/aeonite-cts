name: Known-offset working contract

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-and-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.14']
    env:
      AEONIC_KNOWN_OFFSET_SPECS_ROOT: ${{ github.workspace }}/aeonite-specs
    defaults:
      run:
        working-directory: aeonite-cts
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: aeonite-cts
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: aeonite-org/aeonite-specs
          ref: 427254696af1c1e38898b0c5b8c6158b745cb2ff
          path: aeonite-specs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install runner dependencies
        run: python3 -m pip install -r runners/requirements-aeonic-operations.txt
      - name: Verify complete-result assertions and harness boundaries
        run: python3 -m unittest discover -s runners -p test_aeonic_temporal_known_offset_runner.py -v
      - name: Validate complete mutable target without a conformance claim
        run: python3 runners/run_aeonic_temporal_known_offset.py --specs-root ../aeonite-specs --check
      - name: Validate independent capability boundaries
        run: |
          python3 runners/run_aeonic_temporal_known_offset.py --specs-root ../aeonite-specs --capability-set conversion --check
          python3 runners/run_aeonic_temporal_known_offset.py --specs-root ../aeonite-specs --capability-set relations --check
