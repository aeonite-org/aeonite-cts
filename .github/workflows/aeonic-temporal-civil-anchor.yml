name: Mutable civil anchoring contract

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-and-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.14']
    defaults:
      run:
        working-directory: aeonite-cts
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: aeonite-cts
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: aeonite-org/aeonite-specs
          ref: ccb9ad62b549eb93f12f2d0d2337b8cffe895d3d
          path: aeonite-specs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install runner dependencies
        run: python3 -m pip install -r runners/requirements-aeonic-operations.txt
      - name: Verify anchoring assertions and admission guards
        run: python3 -m unittest discover -s runners -p test_aeonic_temporal_civil_anchor_runner.py -v
      - name: Validate complete mutable target without claiming conformance
        run: python3 runners/run_aeonic_temporal_civil_anchor.py --specs-root ../aeonite-specs --check
